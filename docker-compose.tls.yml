# Overlay: HTTPS on the shop via a self-signed certificate.
#   ./testing/scripts/generate-tls.sh
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
services:
  frontend:
    ports:
      - "3000:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      TLS_ENABLED: "true"

  backend:
    environment:
      APP_COOKIE_SECURE: "true"
      APP_FRONTEND_URL: https://localhost:3000
      APP_CORS_ALLOWED_ORIGINS: https://localhost:3000,http://localhost:3000,http://localhost:5173,http://localhost:8080
